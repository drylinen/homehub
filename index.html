<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Fira Sans">
    <link rel="stylesheet" href="styles.css">
    <title>HomeHub</title>
</head>
<body>
    <div class="container">
        <!-- Top Bar: Search + Tabs -->
        <header class="top-bar">
            <!-- Row 1: Full-width search -->
            <div class="header-row header-row--search">
                <form class="search-box" action="https://www.google.com/search" method="GET" target="_top">
                    <input type="text" name="q" placeholder="Search Google..." autocomplete="off" />
                </form>
            </div>

            <!-- Row 2: Nav tabs (left-aligned) -->
            <div class="header-row header-row--tabs">
                <nav class="tabs">
                    <button class="tab active" data-view="view-tab1">Tab 1</button>
                    <button class="tab" data-view="view-tab2">Tab 2</button>
                    <button class="tab" data-view="view-tab3">Tab 3</button>
                    <button class="tab" data-view="view-tab4">Tab 4</button>
                    <button class="tab" data-view="view-tab5">Tab 5</button>
                </nav>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-area">
            <section id="view-tab1" class="view active">
                <h2>Tab 1</h2>
                <p>Description for tab 1.</p>
                <div class="cells-grid" data-view="tab1"></div>
            </section>
            <section id="view-tab2" class="view">
                <h2>Tab 2</h2>
                <p>Description for tab 2.</p>
                <div class="cells-grid" data-view="tab2"></div>
            </section>
            <section id="view-tab3" class="view">
                <h2>Tab 3</h2>
                <p>Description for tab 3.</p>
                <div class="cells-grid" data-view="tab3"></div>
            </section>
            <section id="view-tab4" class="view">
                <h2>Tab 4</h2>
                <p>Description for tab 4.</p>
                <div class="cells-grid" data-view="tab4"></div>
            </section>
            <section id="view-tab5" class="view">
                <h2>Tab 5</h2>
                <p>Description for tab 5.</p>
                <div class="cells-grid" data-view="tab5"></div>
            </section>
        </main>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
